<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 class="title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <!-- Feedback de combos: se rellena desde game.js (solo presentación) -->
      <div id="hud-stack">
        <div id="combo-hud" class="hud" hidden>
          <span class="label">COMBO</span>
          <span class="value" id="combo-value">×1</span>
        </div>
        <div id="b2b-hud" class="hud" hidden>
          <span class="b2b-badge" id="b2b-badge"></span>
        </div>
      </div>
      <div id="toasts" aria-live="polite"></div>
      <div id="flash"></div>

      <aside class="panel">
        <div class="panel-top">
          <button id="theme-toggle" type="button" aria-label="Cambiar tema"></button>
          <div class="sound-row">
            <button id="sound-toggle" type="button" aria-label="Activar o desactivar el sonido"></button>
            <input id="volume" type="range" min="0" max="100" step="5" aria-label="Volumen">
          </div>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section">
          <span class="label">PIEZAS</span>
          <span class="value" id="pieces">0</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <!-- Récords: solo en GAME OVER (no en PAUSA). Se rellena desde game.js -->
        <div id="gameover-records" hidden>
          <p id="gameover-message"></p>
          <form id="record-form" autocomplete="off" hidden>
            <input id="record-name" type="text" placeholder="Tu nombre" aria-label="Nombre del jugador">
            <button id="record-save" type="submit">Guardar</button>
          </form>
          <table class="records-table">
            <thead><tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th><th>Nivel</th><th>Combo</th></tr></thead>
            <tbody id="gameover-table"></tbody>
          </table>
          <p id="gameover-stats" class="records-stats"></p>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <!-- Tabla de récords visible desde la carga (debajo del tablero, sin taparlo) -->
  <section id="records" aria-labelledby="records-title">
    <h2 id="records-title" class="label">RÉCORDS</h2>
    <table class="records-table">
      <thead><tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th><th>Nivel</th><th>Combo</th></tr></thead>
      <tbody id="records-table"></tbody>
    </table>
    <p id="records-stats" class="records-stats"></p>
    <div class="records-actions">
      <button id="records-reset" type="button">Borrar récords</button>
      <span id="records-confirm" hidden>
        ¿Borrar todos los récords?
        <button id="records-confirm-yes" type="button">Sí, borrar</button>
        <button id="records-confirm-no" type="button">Cancelar</button>
      </span>
    </div>
  </section>

  <script src="game.js"></script>
</body>
</html>
