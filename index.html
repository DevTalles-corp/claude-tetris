<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css?v=10" />
</head>
<body>
  <button id="theme-toggle" type="button" aria-label="Cambiar tema">☀️ Claro</button>
  <select id="skin-select" aria-label="Skin">
    <option value="retro">Retro</option>
    <option value="neon">Neon</option>
    <option value="pastel">Pastel</option>
    <option value="pixel">Pixel art</option>
  </select>
  <main class="app">
  <h1 class="title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <aside class="panel panel-left">
        <div class="panel-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="80"></canvas>
        </div>
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd>/<kbd>Shift</kbd> reservar</li>
            <li><kbd>E</kbd> habilidad</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>M</kbd> silencio</li>
          </ul>
        </div>
      </aside>

      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel panel-right">
        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section hidden" id="peek-section">
          <span class="label">PRÓXIMAS 5</span>
          <canvas id="peek-canvas" width="150" height="40"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">ENERGÍA</span>
          <div class="energy-bar" id="energy-bar"><div class="energy-fill" id="energy-fill"></div></div>
          <span class="energy-hint" id="energy-hint">0%</span>
          <span class="value power-status" id="ability-status">—</span>
        </div>

        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value combo-status" id="combo-status">—</span>
        </div>

        <div class="panel-section">
          <span class="label">POWER</span>
          <span class="value power-status" id="power-status">—</span>
        </div>

        <div class="panel-section hidden" id="goal-section">
          <span class="label">OBJETIVO</span>
          <span class="goal-desc" id="goal-desc"></span>
          <span class="value goal-status" id="goal-status">—</span>
          <span class="value goal-status" id="timer-status"></span>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn" class="btn">Reiniciar</button>
      </div>
    </div>

    <div id="ability-menu" class="overlay hidden">
      <div class="overlay-box ability-box">
        <p class="ability-title" id="ability-title">HABILIDAD</p>
        <ul class="ability-list" id="ability-list"></ul>
        <p class="ability-hint" id="ability-hint"></p>
      </div>
    </div>

  </div>
  </main>

  <script src="game.js?v=10"></script>
</body>
</html>
