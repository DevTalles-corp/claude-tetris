<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    // Aplica el tema guardado antes de pintar (evita parpadeo). Oscuro por defecto.
    try { document.documentElement.dataset.theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark'; }
    catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 id="title" class="title"></h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>T</kbd> tema</li>
          </ul>
        </div>

        <div class="panel-section records-panel">
          <span class="label">RECORDS</span>
          <ol id="records-list" class="records-list"></ol>
          <span id="records-stats" class="records-stats"></span>
          <button id="records-reset" class="records-btn" type="button">Borrar records</button>
        </div>

        <button id="theme-btn" class="theme-btn" type="button">Tema: oscuro</button>
      </aside>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>
          <div id="records-entry" class="records-entry hidden">
            <label for="records-name">¡Nuevo record! Tu nombre:</label>
            <input id="records-name" type="text" maxlength="12" placeholder="Jugador" autocomplete="off" />
            <button id="records-save" class="records-btn" type="button">Guardar</button>
          </div>
          <ol id="records-overlay-list" class="records-list"></ol>
          <button id="restart-btn">Reiniciar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="title.js"></script>
  <script src="records.js"></script>
  <script src="game.js"></script>
</body>
</html>
