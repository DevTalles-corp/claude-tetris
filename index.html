<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 class="title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <!-- Feedback de combos: se rellena desde game.js (solo presentación) -->
      <div id="hud-stack">
        <div id="combo-hud" class="hud" hidden>
          <span class="label">COMBO</span>
          <span class="value" id="combo-value">×1</span>
        </div>
        <div id="b2b-hud" class="hud" hidden>
          <span class="b2b-badge" id="b2b-badge"></span>
        </div>
      </div>
      <div id="toasts" aria-live="polite"></div>
      <div id="flash"></div>

      <aside class="panel">
        <div class="panel-top">
          <button id="theme-toggle" type="button" aria-label="Cambiar tema"></button>
          <div class="sound-row">
            <button id="sound-toggle" type="button" aria-label="Activar o desactivar el sonido"></button>
            <input id="volume" type="range" min="0" max="100" step="5" aria-label="Volumen">
          </div>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section">
          <span class="label">PIEZAS</span>
          <span class="value" id="pieces">0</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="resume-btn" class="menu-btn" type="button" hidden>Reanudar</button>
        <button id="restart-btn">Reiniciar</button>

        <!-- Menú de pausa: solo visible en PAUSA (game.js, sección "Pause menu") -->
        <div id="pause-menu" hidden>
          <button id="controls-btn" class="menu-btn menu-btn-secondary" type="button" aria-expanded="false" aria-controls="pause-controls">Ver controles</button>
          <ul id="pause-controls" hidden>
            <li><span><kbd>←</kbd><kbd>→</kbd></span> mover</li>
            <li><span><kbd>↑</kbd><kbd>X</kbd></span> rotar</li>
            <li><span><kbd>↓</kbd></span> bajar (soft drop)</li>
            <li><span><kbd>Espacio</kbd></span> caída (hard drop)</li>
            <li><span><kbd>P</kbd><kbd>Esc</kbd></span> pausa / reanudar</li>
          </ul>
          <label class="start-level" for="start-level">
            <span>Nivel inicial</span>
            <select id="start-level" autocomplete="off"></select>
          </label>
          <p class="start-level-hint">Se aplica en la próxima partida</p>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
