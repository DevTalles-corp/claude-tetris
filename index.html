<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="title-bar">
    <h1 class="title">TETRIS</h1>
    <span class="version">v1.1</span>
    <button id="theme-toggle" type="button" role="switch" aria-checked="false">Tema claro</button>
  </div>

  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <!-- Menú de pausa -->
    <div id="pause-menu" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="overlay-box pause-box">
        <p id="pause-title">PAUSA</p>
        <button id="pause-resume" type="button" class="pause-btn primary">Reanudar</button>
        <button id="pause-restart" type="button" class="pause-btn">Reiniciar</button>
        <button id="pause-controls-toggle" type="button" class="pause-btn" aria-expanded="false" aria-controls="pause-controls">Ver controles</button>
        <ul id="pause-controls" class="pause-controls" hidden>
          <li><span><kbd>←</kbd><kbd>→</kbd></span> mover</li>
          <li><span><kbd>↑</kbd><kbd>X</kbd></span> rotar</li>
          <li><span><kbd>↓</kbd></span> bajar</li>
          <li><span><kbd>Space</kbd></span> caída instantánea</li>
          <li><span><kbd>P</kbd><kbd>Esc</kbd></span> pausa / reanudar</li>
        </ul>
        <label class="pause-level" for="start-level">
          Nivel inicial
          <select id="start-level"></select>
        </label>
        <p class="pause-hint">Se aplica al reiniciar o en la próxima partida</p>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <!-- Récords: game over -->
        <div id="over-records" class="records-box" hidden>
          <p id="record-msg" class="records-msg"></p>
          <form id="record-form" class="record-form" hidden>
            <input id="record-name" type="text" maxlength="12" value="Jugador" autocomplete="off" aria-label="Nombre del jugador" />
            <button type="submit">Guardar</button>
          </form>
          <div id="over-records-table"></div>
          <button type="button" class="records-reset">Borrar récords</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <!-- Récords: pantalla de inicio -->
    <div id="start-overlay" class="overlay">
      <div class="overlay-box records-box">
        <p class="records-heading">RÉCORDS</p>
        <div id="start-records"></div>
        <button id="play-btn" type="button">Jugar</button>
        <button type="button" class="records-reset">Borrar récords</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
