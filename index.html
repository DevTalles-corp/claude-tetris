<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    // Aplica el tema antes de pintar para evitar parpadeo
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <button id="theme-toggle" type="button" aria-label="Cambiar tema" title="Cambiar tema"></button>

  <header class="title-bar">
    <h1>TETRIS</h1>
    <span class="author">por <a href="https://github.com/925ctrl" target="_blank" rel="noopener">925ctrl (Emerlive)</a></span>
  </header>

  <div class="wrapper">
    <div class="game-container">
      <div class="side-buttons">
        <button id="pause-btn" type="button" aria-label="Pausar" title="Pausar"></button>
        <button id="edit-user-btn" type="button" aria-label="Editar usuario" title="Editar usuario">✎</button>
      </div>
      <canvas id="board"width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>

      <section class="scoreboard">
        <span class="label">SCOREBOARD</span>
        <ol id="scoreboard"></ol>
      </section>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <div id="user-modal" class="user-modal hidden" role="dialog" aria-modal="true" aria-labelledby="user-modal-title">
    <form id="user-form" class="user-modal-box" autocomplete="off">
      <span class="label" id="user-modal-title">NOMBRE DE USUARIO</span>
      <input id="username-input" type="text" maxlength="12" required autocomplete="off" spellcheck="false" placeholder="Tu nombre" />
      <button id="user-save-btn" type="submit">Guardar</button>
    </form>
  </div>

  <script src="game.js"></script>
</body>
</html>
