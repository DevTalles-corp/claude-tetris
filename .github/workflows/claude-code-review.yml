name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Revisa este pull request y da retroalimentación sobre:
            - Calidad del código y buenas prácticas
            - Posibles bugs o problemas
            - Rendimiento (por ejemplo, el bucle de juego y el dibujado en Canvas)
            - Seguridad
            - Coherencia con CLAUDE.md y con la documentación en español

            Responde en español. Publica tu revisión como un comentario en el PR
            usando `gh pr comment`.
          claude_args: |
            --allowed-tools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
